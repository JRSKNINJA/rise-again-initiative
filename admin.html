<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Portal | Rise Again</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><a class="brand" href="index.html"><img src="assets/phoenix.svg">RISE AGAIN <small>STAFF PORTAL</small></a><a href="index.html">Public site</a></header><main class="wrap section"><span class="eyebrow">Restricted access</span><h2>Organisation dashboard</h2><section id="login" class="formbox compact"><h3>Staff sign in</h3><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn blue">Sign in</button><p id="status" class="status"></p></form></section><section id="dash" hidden><div class="grid four" id="counts"></div><h3>Operational records</h3><div id="tabs" class="grid four"><button data-t="donation_intents">Donation pledges</button><button data-t="volunteer_applications">Volunteers</button><button data-t="contact_messages">Enquiries</button><button data-t="partners">Partners</button><button data-t="programmes">Programmes</button><button data-t="events">Events</button><button data-t="outreach_activities">Outreach</button><button data-t="beneficiaries">Beneficiaries</button></div><div id="records"></div><button id="logout" class="btn gold">Sign out</button></section></main><script>const c=RAI_CONFIG,ready=c.SUPABASE_URL?.startsWith('https://')&&c.SUPABASE_ANON_KEY&&!c.SUPABASE_ANON_KEY.includes('YOUR_'),db=ready?supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY):null,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function table(t){$('#records').textContent='Loading…';let{data,error}=await db.from(t).select('*').order('created_at',{ascending:false}).limit(100);$('#records').innerHTML=error?esc(error.message):data.map(x=>'<article><b>'+esc(x.full_name||x.donor_name||x.title||x.name||x.email)+'</b> · '+esc(x.status)+'<p>'+esc(x.email||x.topic||x.interest_area||x.description)+'</p></article>').join('')||'No records.'}if(!db)$('#status').textContent='Configure Supabase URL and anon key in config.js, then apply the SQL migration.';else{$('#loginForm').onsubmit=async e=>{e.preventDefault();let{error}=await db.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error){$('#status').textContent=error.message;return}$('#login').hidden=true;$('#dash').hidden=false;table('donation_intents');let names=['donation_intents','volunteer_applications','contact_messages','partners'];let counts=await Promise.all(names.map(t=>db.from(t).select('id',{count:'exact',head:true})));$('#counts').innerHTML=names.map((t,i)=>'<article><b>'+(counts[i].count??'—')+'</b><p>'+t.replaceAll('_',' ')+'</p></article>').join('')};$('#tabs').onclick=e=>{if(e.target.dataset.t)table(e.target.dataset.t)};$('#logout').onclick=async()=>{await db.auth.signOut();$('#dash').hidden=true;$('#login').hidden=false}};</script></body></html>
